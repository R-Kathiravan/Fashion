<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
         *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;  
            color: #374151; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

         .card-container {
            position: relative;
            display: flex;
            flex-direction: column;
            margin: 1.5rem;
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 1rem;
            max-width: 64rem; 
            overflow: hidden; 
        }

         .image-section {
            position: relative;
            width: 100%;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        
        /* Form Side */
        .form-section {
            width: 100%;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .form-content {
            width: 100%;
            max-width: 28rem; /* 448px */
        }

         .form-wrapper {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .form-hidden {
            opacity: 0;
            transform: scale(0.95);
            position: absolute;
            pointer-events: none;
            width: inherit; 
        }
        .form-visible {
            opacity: 1;
            transform: scale(1);
            position: relative;
            pointer-events: auto;
        }

         h1 {
            font-size: 1.875rem;  
            font-weight: 700;
            color: #1F2937; 
            margin-bottom: 1rem;
        }

        p {
            color: #4B5563; 
            margin-bottom: 2rem;
        }
        
        .form-switch-text {
             margin-top: 2rem;
             text-align: center;
             color: #4B5563; 
        }

        a {
            color: #2563EB; 
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

         form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; 
        }

        label {
            display: block;
            font-size: 0.875rem; 
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #D1D5DB; 
            border-radius: 0.5rem; 
            transition: all 0.2s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: #3B82F6; 
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        .forgot-password-link {
            text-align: right;
            font-size: 0.875rem;
        }
        
        .submit-btn {
            width: 100%;
            background-color: #1F2937; 
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .submit-btn:hover {
            background-color: #111827; 
            transform: translateY(-2px);
        }

         @media (min-width: 768px) {
            .card-container {
                flex-direction: row;
            }

            .image-section {
                width: 50%;
            }
            
            .image-section img {
                border-top-right-radius: 0;
                border-bottom-right-radius: 0;
            }

            .form-section {
                width: 50%;
                padding: 3rem;
            }
        }

    </style>
</head>
<body>
    <div class="card-container">
         <div class="image-section">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=2070&auto=format&fit=crop"
                 alt="A stylish woman shopping with bags in her hand."
                 onerror="this.onerror=null;this.src='https://placehold.co/800x1200/e2e8f0/4a5568?text=FASHION';">
        </div>

         <div class="form-section">
            <div class="form-content">
                
                <!-- Login Form -->
                <div id="login-form" class="form-wrapper form-visible">
                    <h1>Welcome Back</h1>
                    <p>Login to your account to continue.</p>
                    
                    <form>
                        <div>
                            <label for="login-email">Email Address</label>
                            <input type="email" id="login-email" name="email" placeholder="you@example.com" required class="form-input">
                        </div>
                        <div>
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" placeholder="Enter your password" required class="form-input">
                        </div>
                        <div class="forgot-password-link">
                            <a href="#">Forgot Password?</a>
                        </div>
                        <button type="submit" class="submit-btn">Login</button>
                    </form>
                    
                    <p class="form-switch-text">
                        Don't have an account? 
                        <a href="#" id="show-signup">Sign Up</a>
                    </p>
                </div>

                <!-- Signup Form -->
                <div id="signup-form" class="form-wrapper form-hidden">
                    <h1>Create Account</h1>
                    <p>Join us and start your fashion journey.</p>
                    
                    <form>
                        <div>
                            <label for="signup-email">Email Address</label>
                            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required class="form-input">
                        </div>
                        <div>
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" name="password" placeholder="Create a password" required class="form-input">
                        </div>
                         <div>
                            <label for="signup-confirm-password">Confirm Password</label>
                            <input type="password" id="signup-confirm-password" name="confirm-password" placeholder="Confirm your password" required class="form-input">
                        </div>
                        <button type="submit" class="submit-btn">Sign Up</button>
                    </form>
                    
                    <p class="form-switch-text">
                        Already have an account? 
                        <a href="#" id="show-login">Login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignup = document.getElementById('show-signup');
        const showLogin = document.getElementById('show-login');

         function switchForm(hide, show) {
            hide.classList.remove('form-visible');
            hide.classList.add('form-hidden');
            
             setTimeout(() => {
                show.classList.remove('form-hidden');
                show.classList.add('form-visible');
            }, 500);  
        }

         showSignup.addEventListener('click', (e) => {
            e.preventDefault();
            switchForm(loginForm, signupForm);
        });

        showLogin.addEventListener('click', (e) => {
            e.preventDefault();
            switchForm(signupForm, loginForm);
        });

         const forms = document.querySelectorAll('form');
        forms.forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                 if (form.parentElement.id === 'signup-form') {
                    const password = document.getElementById('signup-password').value;
                    const confirmPassword = document.getElementById('signup-confirm-password').value;

                    if (password !== confirmPassword) {
                        alert("Passwords do not match!");
                        return;
                    }
                }
                
                 alert('Form submitted successfully!');
                form.reset();
            });
        });
    </script>
</body>
</html>
